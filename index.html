<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead8">
<title>Thailandia 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap">
<style>
/* Concept: alba sui calcari delle Andamane. Teal profondo + zafferano, regioni codificate a colore, percorso verticale che si disegna scorrendo. */
:root{
  --bg:#f3ead8;--surface:#fbf6ea;--surface2:#eadfc6;--ink:#1c2b2e;--mute:#6a6757;--line:#d9ccb0;
  --saffron:#f0a21e;--on-saffron:#2b1700;--accent-t:#b5381f;--brand:#0e5d63;--on-brand:#fffaf0;--vermilion:#c8402a;
  --bkk:#cf4466;--nord:#d4901d;--lago:#2c9560;--sud:#1b7fb0;--travel:#7b70b8;
  --warn:#8f4308;--warn-bg:#f8e3bd;--tip:#1d6a47;--tip-bg:#dbe9d3;--info:#245a7a;--info-bg:#d9e6e8;
  --shadow:4px 4px 0 rgba(28,43,46,.14);--glass:rgba(243,234,216,.86);
  --display:"Prompt","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;
  --hdr:96px;--r:12px;--serif:"Fraunces","Prompt",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1c;--surface:#162728;--surface2:#1e3436;--ink:#efe6d2;--mute:#a1b0a6;--line:#2c4547;
  --accent-t:#ff8f70;--brand:#5fd0c0;--on-brand:#052420;--vermilion:#ff7a5c;
  --bkk:#ff7a96;--nord:#ffb83d;--lago:#3fd694;--sud:#4cb8f0;--travel:#a79cf2;
  --warn:#ffc266;--warn-bg:#35260e;--tip:#58e0ac;--tip-bg:#0f3329;--info:#8ec3f5;--info-bg:#14293f;
  --shadow:4px 4px 0 rgba(0,0,0,.4);--glass:rgba(15,27,28,.86);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1c;--surface:#162728;--surface2:#1e3436;--ink:#efe6d2;--mute:#a1b0a6;--line:#2c4547;
  --accent-t:#ff8f70;--brand:#5fd0c0;--on-brand:#052420;--vermilion:#ff7a5c;
  --bkk:#ff7a96;--nord:#ffb83d;--lago:#3fd694;--sud:#4cb8f0;--travel:#a79cf2;
  --warn:#ffc266;--warn-bg:#35260e;--tip:#58e0ac;--tip-bg:#0f3329;--info:#8ec3f5;--info-bg:#14293f;
  --shadow:4px 4px 0 rgba(0,0,0,.4);--glass:rgba(15,27,28,.86);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(90% 40% at 100% 0%,color-mix(in srgb,var(--sud) 12%,transparent),transparent),radial-gradient(70% 30% at 0% 55%,color-mix(in srgb,var(--saffron) 8%,transparent),transparent);
  background-repeat:no-repeat;color:var(--ink);font:16px/1.6 var(--body);overflow-x:hidden;padding-bottom:120px}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:0 16px}
section{scroll-margin-top:var(--hdr)}
main>section{display:none}
main>section.active{display:block}
p{margin:0 0 10px}
strong{font-weight:600}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* ---------- barra superiore ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:3px;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--saffron),var(--bkk),var(--sud))}
.top .bar{max-width:720px;margin:0 auto;padding:9px 16px 0;display:flex;align-items:baseline;justify-content:space-between}
.logo{font:800 .95rem var(--display);letter-spacing:.16em}
.logo small{font:500 .78rem var(--body);letter-spacing:0;color:var(--mute);margin-left:8px}
.thai{font:600 .85rem var(--display);color:var(--accent-t)}
.tabs{width:calc(100% - 24px);max-width:696px;margin:7px auto 9px;display:flex;gap:2px;padding:4px;background:var(--surface2);border-radius:99px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font:600 .8rem var(--display);padding:7px 2px;border-radius:99px;transition:background .25s,color .25s}
.tabs a.on{background:var(--ink);color:var(--bg);box-shadow:0 3px 10px rgba(8,50,56,.25)}

/* ---------- intestazioni sezione ---------- */
.sh{margin:46px 0 16px}
.sh .th{font:600 .82rem var(--display);color:var(--accent-t);letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.sh .th::before{content:"";width:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--saffron),var(--bkk))}
.sh h2{font:800 1.8rem/1.12 var(--display);margin:2px 0 0;text-wrap:balance}
.sh p{color:var(--mute);margin:6px 0 0;font-size:.95rem}
h3{font:700 1.05rem var(--display);margin:0 0 8px}

/* ---------- hero ---------- */
.hero{position:relative;margin:14px 0 0;border-radius:28px;overflow:hidden;color:#fff;isolation:isolate;
  background:linear-gradient(180deg,#05262d 0%,#0a4d57 46%,#e9763f 88%,#ffb25c 100%)}
.hero-txt{position:relative;z-index:2;padding:26px 22px 0}
.eyebrow{font:600 .78rem var(--display);letter-spacing:.2em;text-transform:uppercase;color:#ffd9a3}
.hero h1{margin:8px 0 0;font:800 clamp(2rem,9.6vw,3.5rem)/1 var(--display);letter-spacing:.05em}
.hero h1 span{display:inline-block;animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*70ms + 150ms)}
.hero .th2{font:500 1rem var(--display);color:#ffd9a3;margin-top:4px;letter-spacing:.08em;animation:fade 1.4s .9s both}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.chips span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);border-radius:99px;padding:3px 12px;font-size:.84rem}
.count{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.count .num{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums;color:#ffcf8a}
.count .lbl{font-size:.95rem;opacity:.92}
.tripbar{height:6px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin:2px 0 6px}
.tripbar i{display:block;height:100%;width:0;background:#ffcf8a;border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.lead{font-size:.95rem;opacity:.95;margin:10px 0 16px;max-width:52ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:6px}
.btn{border:0;border-radius:99px;padding:12px 20px;font:700 .95rem var(--display);background:var(--saffron);color:var(--on-saffron);box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s}
.btn.ghost{background:rgba(5,38,45,.5);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn:active{transform:scale(.95)}
.scene{display:block;width:100%;height:auto;margin-top:-6px;position:relative;z-index:1}
.sun{animation:sunrise 2.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
.glow{animation:breathe 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:drift var(--t,9s) linear infinite}
.wave.rev{animation-direction:reverse}
.boat{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.boatx{animation:sail 26s ease-in-out infinite alternate}
.bird{animation:fly var(--t,16s) linear infinite;opacity:.85}
@keyframes rise{from{transform:translateY(.7em) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sunrise{from{transform:translateY(60px);opacity:.2}to{transform:none;opacity:1}}
@keyframes breathe{50%{transform:scale(1.08);opacity:.8}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(60px)}}
@keyframes bob{50%{transform:translateY(3px) rotate(1.6deg)}}
@keyframes sail{from{transform:translateX(-40px)}to{transform:translateX(150px)}}
@keyframes fly{from{transform:translate(-40px,0)}50%{transform:translate(380px,-14px)}to{transform:translate(780px,0)}}

/* ---------- calendario a tessere ---------- */
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{--c:var(--travel);position:relative;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:14px;padding:8px 2px 8px;text-align:center;line-height:1.1;overflow:hidden;transition:transform .18s,box-shadow .18s;min-width:0}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.tile small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.tile b{display:block;font:800 1.45rem/1.15 var(--display);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.66rem;color:var(--mute);margin-top:2px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:active{transform:scale(.94)}
@media (hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}}
.tile.today{outline:3px solid var(--saffron);outline-offset:1px}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--mute);margin:12px 0 0}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--c)}

/* ---------- percorso ---------- */
.route{position:relative;padding-left:44px}
.rline{position:absolute;left:15px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--line)}
.rline i{display:block;width:100%;height:0;border-radius:4px;background:linear-gradient(180deg,var(--bkk),var(--nord),var(--lago),var(--sud))}
.stage{--c:var(--travel);position:relative;margin-bottom:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.stage:active{transform:scale(.985)}
@media (hover:hover){.stage:hover{transform:translateY(-3px);box-shadow:var(--shadow)}}
.node{position:absolute;left:-37px;top:20px;width:18px;height:18px;border-radius:50%;background:var(--c);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.stage.live .node::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
.stage .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stage .where{font:700 1.2rem/1.2 var(--display)}
.stage .when{font-size:.78rem;font-weight:600;color:var(--mute);letter-spacing:.02em}
.stage .hl{font-size:.92rem;color:var(--mute);margin:3px 0 0}
.stage .base{font-size:.84rem;margin-top:6px;display:flex;gap:6px;align-items:center}
.stage .base::before{content:"";width:8px;height:8px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);flex:none}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{border:1.5px solid var(--c,var(--brand));color:var(--ink);background:transparent;border-radius:99px;padding:5px 12px;font:600 .8rem var(--display);text-decoration:none;transition:background .15s,transform .15s}
.pill:active{transform:scale(.93);background:color-mix(in srgb,var(--c,var(--brand)) 25%,transparent)}
.pill.today{background:var(--saffron);border-color:var(--saffron);color:var(--on-saffron)}
.legend{font-size:.85rem;color:var(--mute);margin:0 0 12px}

/* ---------- voli ---------- */
.passes{display:grid;gap:10px}
.pass{background:linear-gradient(135deg,color-mix(in srgb,var(--sud) 9%,var(--surface)),var(--surface) 60%);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;position:relative;box-shadow:0 6px 18px rgba(8,50,56,.06)}
.pass::before,.pass::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line);transform:translateY(-50%)}
.pass::before{left:-8px}.pass::after{right:-8px}
.pass .d{font:600 .74rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pass .iata{display:flex;align-items:center;gap:10px;margin:2px 0}
.pass .iata b{font:800 1.7rem/1 var(--display)}
.pass .path{flex:1;position:relative;height:34px;min-width:20px}
.pass .path::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line)}
.pass .path svg{position:absolute;left:0;top:50%;width:var(--ps,18px);height:var(--ps,18px);margin-top:calc(var(--ps,18px) / -2);fill:var(--pc,var(--brand));transform:rotate(90deg);animation:plane 4.5s ease-in-out infinite}
@keyframes plane{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - var(--ps,18px));opacity:0}}
.pass .nm{display:flex;justify-content:space-between;font-size:.84rem;color:var(--mute)}
.pass .tm{font:700 .95rem var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.sub3{font:700 .8rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}

/* ---------- box ---------- */
.box{border-radius:14px;padding:12px 16px;margin:14px 0;font-size:.94rem;background:var(--bg-b);color:var(--ink)}
.box h4{margin:0 0 4px;font:700 .98rem var(--display);color:var(--fg-b)}
.box ul{margin:4px 0 0;padding-left:18px}.box li{margin:4px 0}
.box p:last-child{margin-bottom:0}
.box.warn{--bg-b:var(--warn-bg);--fg-b:var(--warn)}
.box.tip{--bg-b:var(--tip-bg);--fg-b:var(--tip)}
.box.info{--bg-b:var(--info-bg);--fg-b:var(--info)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 6px 18px rgba(8,50,56,.05)}

/* ---------- giorni ---------- */
details.day{--c:var(--travel);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;scroll-margin-top:var(--hdr);overflow:hidden;transition:box-shadow .25s,opacity .28s,transform .28s}
details.day.leaving{opacity:0;transform:translateX(28px) scale(.97)}
details.day.done:not(.peek){display:none}
details.day[open]{box-shadow:var(--shadow)}
details.day>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:12px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 75%)}
details.day>summary::-webkit-details-marker{display:none}
.dbadge{flex:none;width:58px;text-align:center;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--c);padding:5px 2px;line-height:1.05}
.dbadge b{display:block;font:800 1.45rem var(--display)}
.dbadge small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.dtitle{flex:1;min-width:0}
.dtitle strong{display:block;font:700 1rem/1.25 var(--display)}
.dtitle span{font-size:.84rem;color:var(--mute)}
.chev{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.chev::before{content:"";width:7px;height:7px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(-45deg);margin-left:-2px}
details[open]>summary .chev{transform:rotate(90deg)}
.todaytag{background:var(--saffron);color:var(--on-saffron);font:700 .66rem var(--display);border-radius:99px;padding:1px 9px;margin-left:8px;vertical-align:middle;letter-spacing:.05em}
.dbody{padding:4px 14px 16px}
details[open] .dbody{animation:unfold .45s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tl{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl li{position:relative;padding:9px 0;display:grid;gap:3px}
.tl li::before{content:"";position:absolute;left:-18px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c)}
.tl li.nt::before{display:none}
.tl .t{justify-self:start;font:700 .76rem var(--display);letter-spacing:.03em;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--surface));border-radius:99px;padding:1px 10px}
.dnav{display:flex;gap:8px;margin-top:16px}
.dnav button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 6px;font:600 .84rem var(--display);transition:transform .15s,background .15s}
.dnav button:active{transform:scale(.95)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font:600 .82rem var(--display)}

/* ---------- tabelle a schede ---------- */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:0 4px 14px rgba(8,50,56,.05)}
.tcard .h{font:700 .98rem var(--display);margin-bottom:3px}
.tcard .kv{display:grid;grid-template-columns:84px 1fr;gap:2px 10px;font-size:.88rem}
.tcard .kv span:nth-child(odd){color:var(--mute)}
.tcard.tot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tcard.tot .kv span:nth-child(odd){color:inherit;opacity:.7}

/* ---------- liste ---------- */
ul.pl{list-style:none;margin:6px 0 0;padding:0}
ul.pl li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
ul.pl li:first-child{border-top:0}
ul.pl label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;width:100%}
ul.pl input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border-radius:8px;border:2px solid var(--mute);background:var(--surface);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
ul.pl input::after{content:"";width:6px;height:11px;border:solid var(--on-brand);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1);margin-top:-2px}
ul.pl input:checked{background:var(--brand);border-color:var(--brand);transform:scale(1.08)}
ul.pl input:checked::after{transform:rotate(45deg) scale(1)}
ul.pl input:checked+span{color:var(--mute);text-decoration:line-through}
ul.bl{margin:6px 0 10px;padding-left:20px}ul.bl li{margin:6px 0}
.meter{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 .85rem var(--display)}
.meter .bar{flex:1;height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--saffron),var(--lago));transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- fisarmoniche ---------- */
details.acc{--c:var(--brand);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);margin-bottom:10px;scroll-margin-top:var(--hdr);overflow:hidden;box-shadow:0 4px 14px rgba(8,50,56,.04);transition:box-shadow .25s}
details.acc[open]{box-shadow:var(--shadow)}
details.acc details.acc{box-shadow:none;margin-bottom:8px}
details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font:700 1rem var(--display)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .chev{margin-left:auto}
details.acc>summary .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
details.acc small{font:500 .8rem var(--body);color:var(--mute)}
details.acc .abody{padding:0 16px 16px}
details[open] .abody{animation:unfold .45s cubic-bezier(.2,.8,.2,1)}
.abody h4{margin:16px 0 4px;font:700 .98rem var(--display)}
.pills.links .pill{--c:var(--brand)}

footer{text-align:center;color:var(--mute);margin:44px 0 10px}
footer .th{font:800 1.5rem var(--display);color:var(--accent-t);display:block}
footer small{font-size:.84rem}

/* ---------- FAB + menu ---------- */
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab button{border:0;border-radius:99px;box-shadow:0 8px 22px rgba(0,0,0,.3);font:700 1rem var(--display);transition:transform .15s,opacity .3s}
.fab button:active{transform:scale(.92)}

.donechk{display:flex;align-items:center;gap:12px;margin:2px 0 6px;padding:10px 12px;border-radius:12px;background:var(--surface2);cursor:pointer;font:600 .9rem var(--display)}

.donechk input:checked::after{transform:rotate(45deg) scale(1)}


/* ---------- sezioni: una alla volta ---------- */
[hidden]{display:none!important}
main>section.active{animation:secin .4s cubic-bezier(.2,.8,.2,1) both}
main>section.active.swp{animation:secx .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes secx{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}

.mvrestore:active{transform:scale(.95)}
.mvi{position:relative;transition:opacity .28s,transform .28s cubic-bezier(.4,0,.2,1)}
.mvi.leaving{opacity:0;transform:translateX(28px) scale(.97)}
.mvi.gone,.mvgroup.empty{display:none}
.mvi .tcard,.mvi .pass,.mvi .box{padding-right:56px}
.mvchk{position:absolute;top:50%;right:12px;width:34px;height:34px;margin-top:-17px;padding:0;border-radius:50%;border:2px solid var(--mute);background:var(--surface);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .15s;z-index:2}

.mvchk:active,.mvi.leaving .mvchk{background:var(--lago);border-color:var(--lago);transform:scale(1.1)}
.mvi.leaving .mvchk::after,.mvchk:active::after{transform:rotate(45deg) scale(1)}

.mvempty{display:grid;gap:2px;text-align:center;margin:24px 0;padding:22px 16px;border-radius:var(--r);background:var(--tip-bg);color:var(--tip)}
.mvempty b{font:800 1.3rem var(--display)}
.snack{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 8px 8px 18px;font-size:.88rem;box-shadow:0 10px 26px rgba(0,0,0,.3);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.1,.3,1)}

.snack button{border:0;border-radius:99px;background:var(--saffron);color:var(--on-saffron);padding:6px 14px;font:700 .84rem var(--display)}

        ["10:00–13:30", "**Chatuchak Weekend Market** (sabato, comodo perché a metà strada verso Don Mueang). BTS fino a Mo Chit. Oltre 15.000 bancarelle: fissate un punto di ritrovo e un'ora. Contrattate sempre, si parte dal 50–60% del prezzo. Qui potete comprare magliette leggere e pantaloni da tempio."],
        ["14:00", "Rientro in hotel per gli zaini, oppure (più efficiente) portateli con voi e lasciateli in un deposito bagagli vicino a Mo Chit."],
        ["15:15", "Grab per **Don Mueang (DMK)**: 20–30 min, ~250 THB a veicolo. Al terminal domestico entro le **15:45** per il volo delle 17:20."],
        ["18:45", "Arrivo a Chiang Rai. L'aeroporto è a 10 km dal centro: taxi ufficiale ~200–250 THB a veicolo, 20 minuti."],
        ["Sera", "**Saturday Walking Street**: ogni sabato Thanalai Road è chiusa al traffico dalle 16:00 a mezzanotte. Cibo del nord (khao soi, sai ua, larb), artigianato delle tribù, musica dal vivo e food court all'aperto con piatti da 60–80 THB."]

      boxes: [
        { kind: "info", title: "Il nord è un'altra Thailandia", text: "Fine novembre è la stagione migliore: 28–30 °C di giorno ma 14–17 °C all'alba e la sera, aria secca, cielo terso. Servono una felpa e pantaloni lunghi. La cucina Lanna ha meno cocco e più erbe, salsicce speziate, kaeng hang lay e la zuppa khao soi: provatela." }
      ] },

      items: [

        ["10:30", "**Baan Dam, la Casa Nera** · 80 THB, 09:00–17:00 con pausa 12:00–13:00. Quaranta strutture in teak nero piene di ossa, pelli e corni: l'opposto del Tempio Bianco."],

        ["20:00", "**Sunday Walking Street**: il mercato della domenica di Chiang Mai, il più bello della Thailandia. Parte da Tha Pae Gate e attraversa la città vecchia fino alle 22:30. Cibo, artigianato vero, musicisti a ogni angolo. È l'unica domenica che avete."]

    { id: "d6", date: "2026-11-30", color: "nord", title: "Chiang Mai: un giorno pieno, due modi di usarlo", place: "Chiang Mai",
      items: [
        ["", "Avete una giornata sola. Scegliete **una** delle opzioni: farle tutte significa farle male."],

        ["07:30", "**Monk's Trail e Wat Pha Lat**: sentiero di 45 minuti nella foresta, segnato da fasce arancioni, fino a un tempio nascosto fra le rocce e una cascata. Gratuito, quasi vuoto al mattino, il posto più bello di Chiang Mai. Parte dalla fine di Suthep Road."],
        ["10:00", "**Doi Suthep** · 30 THB. Dal Wat Pha Lat a piedi (1h30, ripido) o songthaew (50 THB). 306 gradini con i naga, chedi dorato e vista sulla valle."],
        ["13:00", "**Nimmanhaemin**, quartiere di caffè e università. Pranzo, poi One Nimman."],
        ["15:30", "Città vecchia: **Wat Chedi Luang** (50 THB, chedi del '400 mezzo crollato per un terremoto) e **Wat Phra Singh** (50 THB). In mezzo, massaggio thai da 250–350 THB l'ora."],
        ["19:00", "Cena e Night Bazaar, oppure (meglio) **Chang Phuak Gate Night Market**, dove mangiano i thailandesi (celebre la \"Cowboy Hat Lady\" col maiale stufato)."],
        ["Opzione B", "**Santuario degli elefanti** (giornata intera). Il bagno con gli elefanti è marketing e li stressa: scegliete programmi di sola osservazione, senza cavalcate né spettacoli."],
        ["", "**Elephant Nature Park** (programma \"Single Day Visit\", solo osservazione, ~2.500 THB, prenotare con settimane di anticipo). **Chang Chill** (Mae Wang, modello \"hands-off\", gruppi piccoli, ~2.400 THB). **BEES** (elefanti anziani in pensione, pochissimi visitatori)."],
        ["", "Diffidate del nome \"sanctuary\": se sul sito ci sono foto di turisti che lavano gli elefanti, non lo è."],
        ["Opzione C", "**Solo divertimento.** **Bua Thong \"Sticky Waterfalls\"**: cascata su calcare non scivoloso da risalire a piedi nudi, gratuita, a un'ora dalla città, praticamente solo thailandesi. **Grand Canyon Water Park**: cava allagata con tuffi e gonfiabili, 20 minuti dalla città, ~500 THB."]
      ],
      boxes: [
        { kind: "warn", title: "Preparate gli zaini stasera", text: "Domani volo alle **11:40** da Chiang Mai: in aeroporto per le 10:00, quindi **partenza dall'hotel alle 09:30**. CNX è a 15 minuti dalla città vecchia. Da qui il clima cambia: al sud 31–33 °C con umidità alta, felpe e pantaloni lunghi in fondo allo zaino." }

    { id: "d8", date: "2026-12-02", color: "lago", title: "Lago Cheow Lan · notte sulle case galleggianti", place: "Parco di Khao Sok",

        ["08:00", "Pick-up al villaggio, 65 km fino al molo di Ratchaprapha (1h15)."],
        ["09:30", "Ingresso al parco (**320 THB** a testa, solo contanti) e tassa molo (40 THB). Poi 1h–1h30 di longtail attraverso il lago: è già l'attrazione."],
        ["11:00", "Arrivo alla raft house, sistemazione, pranzo thai su un pontile."],
        ["Pomeriggio", "Kayak fra i pinnacoli (di solito inclusi), nuotate dal pontile, trekking verso la Nam Talu Cave o la Coral Cave (con guida, si cammina nell'acqua: scarpe che si possono bagnare)."],
        ["18:00", "Cena, poi **night safari** in barca con le torce: civette, cervi latranti, a volte elefanti selvatici."],
        ["21:00", "La corrente nelle raft house si spegne quasi ovunque fra le 21:00 e le 22:00. Power bank carica e torcia frontale. Silenzio e stelle."]

    { id: "d11", date: "2026-12-05", color: "sud", title: "Phi Phi · giro in longtail privato all'alba", place: "Koh Phi Phi",
      items: [
        ["", "La giornata in cui vale la pena spendere bene. I tour di gruppo arrivano a Maya Bay alle 10–11, 40 persone a barca. Voi siete 8: **longtail privato con skipper** per tutto il giorno, 3.500–5.000 THB la barca (450–620 THB a testa), orari decisi da voi."],

        ["06:45", "**Maya Bay** · 400 THB di ingresso al parco nazionale. Le barche attraccano a Loh Sama Bay, dietro l'isola, e si arriva con una passerella. **Non si può nuotare** (acqua al massimo fino al ginocchio, i ranger sono severi). Circa un'ora."],
        ["08:00", "**Pileh Lagoon**: piscina naturale verde chiusa da pareti verticali. Qui si nuota, e prestissimo siete quasi soli."],
        ["09:00", "**Viking Cave** (nidi di rondine, solo da fuori) e **Loh Samah Bay**, ottimo snorkeling."],
        ["10:00", "**Monkey Beach**: carina, ma i macachi sono aggressivi e rubano. Niente cibo a vista, non allungate la mano (rischio rabbia)."],
        ["11:00", "**Bamboo Island**, inclusa nella stessa tassa: sabbia bianca, acqua turchese e snorkeling migliore che a Maya. Pranzo al sacco o rientro."],

      boxes: [
        { kind: "tip", title: "Nota su Maya Bay", text: "La baia è rimasta chiusa quattro anni (2018–2022) per far ricrescere il corallo, e ogni anno richiude dal 1 agosto al 30 settembre. Le regole di oggi sono il motivo per cui è ancora bella: rispettatele. Il biglietto da 400 THB vale tutta la giornata e copre anche Bamboo Island e Pileh: conservatelo." }
      ] },

const dayById = id => TRIP.days.find(d => d.id === id);
const TODAY = isoToday();
const todayDay = TRIP.days.find(d => d.date === TODAY);
const safe = fn => { try { return fn(); } catch (e) { return null; } };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtDay = d => { const dt = parse(d.date); return { g: GG[dt.getDay()], n: dt.getDate(), m: MESI[dt.getMonth()], mm: String(dt.getMonth() + 1).padStart(2, '0') }; };
const shortPlace = d => d.place.split(' → ').pop();
const heading = (id, title, sub) => { const s = SECTIONS.find(x => x[0] === id); return `<div class="sh rv"><div class="th">${s[2]}</div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>`; };

const linkBtns = ls => ls && ls.length ? `<div class="pills links">${ls.map(l => `<a class="pill" target="_blank" rel="noopener" href="${esc(l.url)}">${esc(l.label)} ↗</a>`).join('')}</div>` : '';
const box = b => `<div class="box ${b.kind || 'info'}">${b.title ? `<h4>${md(b.title)}</h4>` : ''}${b.text ? `<p>${md(b.text)}</p>` : ''}${b.list ? `<ul>${b.list.map(x => `<li>${md(x)}</li>`).join('')}</ul>` : ''}</div>`;
const table = t => {
  const rest = t.head.slice(1);
  return t.rows.map(r => {
    const tot = /^TOTALE/.test(r[0]);
    return `<div class="tcard${tot ? ' tot' : ''}"><div class="h">${md(r[0])}</div><div class="kv">${rest.map((h, i) => r[i + 1] ? `<span>${esc(h)}</span><span>${md(r[i + 1])}</span>` : '').join('')}</div></div>`;
  }).join('');
};

function planeSvg() { return '<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>'; }
const TZ = { VCE: 1, VIE: 1, BKK: 7, DMK: 7, CEI: 7, CNX: 7, HKT: 7, TST: 7 };
function flightMin(codes, time) {
  const m = time.match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})(?:\s*\(\+(\d)\))?/);
  if (!m || TZ[codes[0]] == null || TZ[codes[1]] == null) return 0;
  const dep = +m[1] * 60 + +m[2] - TZ[codes[0]] * 60;
  const arr = +m[3] * 60 + +m[4] + (+m[5] || 0) * 1440 - TZ[codes[1]] * 60;
  return Math.max(0, arr - dep);
}
const flightDur = (codes, time) => { const d = flightMin(codes, time); return d ? ` · ${Math.floor(d / 60)}h ${String(d % 60).padStart(2, '0')}` : ''; };
/* aereo più grande e colorato sui voli lunghi, piccolo sui brevi */
function planeStyle(d) {
  if (!d) return '';
  const size = Math.round(16 + Math.min(1, Math.max(0, (d - 60) / 600)) * 16);
  const col = d < 120 ? 'var(--sud)' : d < 480 ? 'var(--nord)' : 'var(--vermilion)';
  return `--ps:${size}px;--pc:${col}`;
}
function pass(r) {
  const codes = r[1].match(/\b[A-Z]{3}\b/g) || ['', ''];
  const names = r[1].split('→').map(s => s.replace(/\b[A-Z]{3}\b/, '').replace(/\(.*?\)/, '').trim());
  return `<div class="pass rv" style="${planeStyle(flightMin(codes, r[2]))}"><div class="d">${esc(r[0])}</div>
    <div class="iata"><b>${esc(codes[0])}</b><div class="path">${planeSvg()}</div><b>${esc(codes[1])}</b></div>
    <div class="nm"><span>${esc(names[0])}</span><span>${esc(names[1] || '')}</span></div><div class="tm">${esc(r[2])}<span class="dur">${flightDur(codes, r[2])}</span></div></div>`;
}

let snackT = 0, snackKey = null;
function showSnack(undo) {
  snackKey = undo; const s = $('#snack'); s.classList.add('on');
  clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove('on'), 5000);
}
function updateMove() {
  const all = $$('.mvi'), hid = all.filter(el => MV[el.dataset.mv]);
  all.forEach(el => el.classList.toggle('gone', !!MV[el.dataset.mv]));
  $$('.mvgroup').forEach(g => g.classList.toggle('empty', !$$('.mvi:not(.gone)', g).length));
  const t = $('#mvTxt'); if (!t) return;
  t.textContent = `${all.length - hid.length} da fare · ${hid.length} fatti`;
  $('#mvRestore').hidden = !hid.length;
  $('#mvEmpty').hidden = !(all.length && hid.length === all.length);
}
function bindMoves() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-mvchk]'); if (!b) return;
    const el = b.closest('.mvi'); if (el.classList.contains('leaving')) return;
    el.classList.add('leaving');
    setTimeout(() => { MV[b.dataset.mvchk] = 1; saveMv(); el.classList.remove('leaving'); updateMove(); showSnack(() => { delete MV[b.dataset.mvchk]; saveMv(); updateMove(); }); }, reduced ? 0 : 280);
  });
  $('#mvRestore').onclick = () => { Object.keys(MV).forEach(k => delete MV[k]); saveMv(); updateMove(); $('#snack').classList.remove('on'); };
  $('#snackUndo').onclick = () => { if (snackKey) snackKey(); snackKey = null; $('#snack').classList.remove('on'); };
  updateMove();
}

function renderTabs() {

  $('#hdrDates').textContent = `${s.getDate()} ${MESI[s.getMonth()]} – ${e.getDate()} ${MESI[e.getMonth()]}`;

let swipeDir = 0;
function showSection(id) {
  $$('main>section').forEach(s => {
    s.classList.toggle('active', s.id === id);
    s.classList.toggle('swp', s.id === id && !!swipeDir);
    if (s.id === id) s.style.setProperty('--dx', swipeDir * 34 + 'px');
  });
  swipeDir = 0;
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.go === id));
}
function goTo(id, closeId) {
  const el = document.getElementById(id);
  if (!el) return;
  if (closeId) { const c = document.getElementById(closeId); if (c) c.open = false; }
  const sec = el.closest('main>section');
  if (sec) showSection(sec.id);
  if (el.classList.contains('done')) el.classList.add('peek');
  if (el.tagName === 'DETAILS') el.open = true;
  setTimeout(() => {
    el.classList.add('in');
    if (el === sec) window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    else el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    safe(() => history.replaceState(null, '', '#' + id));
  }, 30);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { e.preventDefault(); goTo(b.dataset.go, b.dataset.close); }
});
/* swipe orizzontale tra le sezioni */
(() => {
  let x0, y0, t0, ok = false;
  const hscroll = el => { for (; el && el !== document.body; el = el.parentElement) if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true; return false; };
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    ok = e.touches.length === 1 && !hscroll(e.target) && !e.target.closest('input,textarea,select');
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!ok) return; ok = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - t0 > 700) return;
    const ids = SECTIONS.map(x => x[0]), cur = ids.indexOf(($('main>section.active') || {}).id), nx = cur + (dx < 0 ? 1 : -1);
    if (cur < 0 || nx < 0 || nx >= ids.length) return;
    swipeDir = dx < 0 ? 1 : -1;
    goTo(ids[nx]);
  }, { passive: true });
})();
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.stage[data-go]')) { e.preventDefault(); goTo(e.target.dataset.go); }
});

$('#upBtn').onclick = () => window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });

/* ---------- SPUNTE (salvate sul telefono) ---------- */
function updatePack() {
  const all = $$('input[data-pack]'), done = all.filter(i => i.checked).length;
  const t = $('#packTxt'), b = $('#packBar');
  if (t && b) { t.textContent = `Zaino pronto: ${done}/${all.length}`; b.style.width = (all.length ? done / all.length * 100 : 0) + '%'; }
}
function bindChecks() {
  const store = safe(() => JSON.parse(localStorage.getItem('thai26') || '{}')) || {};
  $$('input[data-k]').forEach(i => {
    i.checked = !!store[i.dataset.k];
    i.addEventListener('change', () => { store[i.dataset.k] = i.checked; safe(() => localStorage.setItem('thai26', JSON.stringify(store))); updatePack(); });
  });
  const r = $('#resetChecks');
  if (r) r.onclick = () => {
    if (r.dataset.arm) { $$('input[data-k]').forEach(i => i.checked = false); safe(() => localStorage.removeItem('thai26')); updatePack(); r.textContent = 'Azzera spunte'; delete r.dataset.arm; }
    else { r.dataset.arm = 1; r.textContent = 'Tocca ancora per confermare'; setTimeout(() => { r.textContent = 'Azzera spunte'; delete r.dataset.arm; }, 3000); }
  };
  updatePack();
}

/* ---------- GIORNI FATTI (salvati sul telefono) ---------- */
const DONE = safe(() => JSON.parse(localStorage.getItem('thai26done') || '{}')) || {};
const saveDone = () => safe(() => localStorage.setItem('thai26done', JSON.stringify(DONE)));
function nextDay() {
  if (todayDay && !DONE[todayDay.id]) return todayDay;
  let last = -1; TRIP.days.forEach((d, i) => { if (DONE[d.id]) last = i; });
  return TRIP.days.slice(last + 1).find(d => !DONE[d.id]) || TRIP.days.find(d => !DONE[d.id]) || null;
}
function updateDone() {
  const n = TRIP.days.filter(d => DONE[d.id]).length, tot = TRIP.days.length;
  TRIP.days.forEach(d => {
    const on = !!DONE[d.id];
    const det = document.getElementById(d.id); if (det) det.classList.toggle('done', on);
    const chk = document.getElementById('done_' + d.id); if (chk) chk.checked = on;
    $$('.tile[data-go="' + d.id + '"], .pill[data-go="' + d.id + '"]').forEach(el => el.classList.toggle('done', on));
  });
  $$('.stage').forEach(st => { const ps = $$('.pill', st); st.classList.toggle('done', ps.length > 0 && ps.every(p => p.classList.contains('done'))); });
  const rd = $('#resetDone'); if (rd) rd.hidden = !n;
  const de = $('#dayEmpty'); if (de) de.hidden = n < tot;
  const t = $('#doneTxt'), b = $('#doneBar');
  if (t && b) { t.textContent = n ? 'Giorni fatti: ' + n + '/' + tot : 'Spunta i giorni che hai già fatto'; b.style.width = (n / tot * 100) + '%'; }
  const c = $('#ctaMain');
  if (c) {
    const nd = nextDay(), f = nd && fmtDay(nd);
    if (!nd) { c.textContent = 'Viaggio completato: rivedi'; c.dataset.go = TRIP.days[0].id; }
    else if (todayDay && nd.id === todayDay.id) { c.textContent = 'Vai a oggi'; c.dataset.go = nd.id; }
    else if (!n) { c.textContent = 'Inizia dal giorno 1'; c.dataset.go = nd.id; }
    else { c.textContent = 'Continua: ' + f.g + ' ' + f.n + '/' + f.mm; c.dataset.go = nd.id; }
  }
}
function bindDone() {
  document.addEventListener('change', e => {
    const i = e.target.closest('input[data-done]'); if (!i) return;
    const id = i.dataset.done, det = document.getElementById(id);
    if (i.checked) {
      DONE[id] = 1; saveDone();
      if (det) det.classList.add('leaving');
      setTimeout(() => {
        if (det) det.classList.remove('leaving', 'peek');
        updateDone();
        showSnack(() => { delete DONE[id]; saveDone(); updateDone(); });
      }, reduced ? 0 : 280);
    } else { delete DONE[id]; saveDone(); updateDone(); }
  });
  const r = $('#resetDone');
  if (r) r.onclick = () => { Object.keys(DONE).forEach(k => delete DONE[k]); saveDone(); $$('details.day.peek').forEach(d => d.classList.remove('peek')); updateDone(); $('#snack').classList.remove('on'); };
  updateDone();
}

/* ---------- animazioni ---------- */
function countUp() {
  $$('.num[data-to]').forEach(el => {
    const to = +el.dataset.to; if (reduced || to < 2) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 1400;
    const step = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  setTimeout(() => $$('.tripbar i').forEach(i => i.style.width = i.dataset.w + '%'), 300);
}
function setupReveal() {
  if (reduced || !('IntersectionObserver' in window)) { $$('.rv').forEach(el => el.classList.add('in')); return; }
  document.documentElement.classList.add('js');
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; io.unobserve(el);
    el.style.transitionDelay = Math.min(el.dataset.d || 0, 300) + 'ms';
    el.classList.add('in');
    setTimeout(() => { el.classList.remove('rv', 'in'); el.style.transitionDelay = ''; }, 1100);
  }), { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  $$('.rv').forEach(el => io.observe(el));
  // sicurezza: se qualcosa resta nascosto, mostra tutto dopo 4 secondi
  setTimeout(() => $$('.rv').forEach(el => el.classList.add('in')), 4000);
}
function setupScroll() {
  const prog = $('#progress'), fill = $('#rfill'), route = $('#route'), up = $('#upBtn');
  let tick = false;
  const run = () => {
    tick = false;
    const h = document.documentElement, max = h.scrollHeight - innerHeight;
    prog.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
    up.classList.toggle('show', scrollY > 600);
    if (route && fill) { const r = route.getBoundingClientRect(); fill.style.height = Math.max(0, Math.min(1, (innerHeight * .65 - r.top) / r.height)) * 100 + '%'; }
  };
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(run); } }, { passive: true });
  addEventListener('resize', run); run();
}

/* ---------- avvio ---------- */
function init() {
  document.title = TRIP.title.charAt(0) + TRIP.title.slice(1).toLowerCase() + ' ' + TRIP.end.slice(0, 4);
  renderTabs(); renderTrip(); renderDays(); renderMoves(); renderInfo(); bindChecks(); bindDone(); bindMoves();
  $('#openAll').onclick = () => $$('details.day').forEach(d => d.open = true);
  $('#closeAll').onclick = () => $$('details.day').forEach(d => d.open = false);
  const hdr = $('header.top'); const setH = () => document.documentElement.style.setProperty('--hdr', (hdr.offsetHeight + 8) + 'px');
  setH(); addEventListener('resize', setH);
  showSection('viaggio');
  $$('.cal .tile, .passes .pass, .route .stage').forEach((el, i) => el.dataset.d = (i % 5) * 60);
  setupReveal(); setupScroll(); countUp();
  const h = location.hash.slice(1);
  if (h && document.getElementById(h)) setTimeout(() => goTo(h), 200);
  else if (todayDay) document.getElementById(todayDay.id).open = true;
}
init();
</script>
</body>
